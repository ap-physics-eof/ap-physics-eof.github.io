<<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Physics Engine</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Math&display=swap');

      * {
        font-family: "Noto Sans Math", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      #screen {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        position: absolute;
      }

      #controller {
        position: absolute;
        top: 0; right: 0;
        z-index: 9999;
      }

      .panel {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 9999;
        list-style-type: none;
        padding: 15px;
        margin: 0;
        
        background-color: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid #333;
        border-radius: 12px;
        
        width: 260px;
        height: auto;
        max-height: 130px;
        overflow-y: auto;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        color: #eee;

        transition: opacity 0.3s ease-in-out 0s;
      }

      .panel > li {
        padding: 8px 0;
        border-bottom: 1px solid #222;
        font-size: 0.9rem;
      }

      input {
        width: 50px;
        background: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        padding: 4px;
        margin-left: 5px;
        text-align: center;
      }

      input:focus {
        outline: none;
        border-color: #555;
        background: #444;
      }

      b {
        display: inline-block;
        width: 20px;
        color: #888;
        font-weight: 600;
      }

      button {
        width: 25%;
        padding: 8px;
        background: #444;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-weight: 600;
        margin-top: 5px;
      }

      button:hover {
        background: #555;
      }

      #add {
        top: 200px;
        max-height: 240px;
      }

      #add li:nth-child(1) {
        text-align: center;
      }

      .panel::-webkit-scrollbar { width: 6px; }
      .panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }    }
    </style>
  </head>
  <body>
    <button id="controller">Play</button>

    <ul class="panel" id="add">
      <li>Make New</li>
      <li>Position: <input type="number" placeholder=0 id="nposx"></input><input type="number" placeholder=0 id="nposy"></input></li>
      <li>Velocity: <input type="number" placeholder=0 id="nvelx"></input><input type="number" placeholder=0 id="nvely"></input></li>
      <li>Acceleration: <input type="number" placeholder=0 id="nacex"></input><input type="number" placeholder=0 id="nacey"></input></li>
      <li>Mass: <input type="number" placeholder=10 id="mass"></input></li>
      <li>Size: <input type="number" placeholder=10 id="width"></input><input type="number" placeholder=10 id="height"></input></li>
      <li><button id="make">New</button></li>
    </ul>
    <ul class="panel" id="list">
    </ul>
    <canvas id="screen">
    </canvas>

    <script src="render.js"></script>
    <script src="physics.js"></script>
    <script src="input.js"></script>
  </body>
</html>
